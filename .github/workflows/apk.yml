# Build APK PADEV Studio di GitHub (tanpa Mac): uji (analyze, flutter test, unit test JVM) lalu APK debug & profile arm64.
# Hasil: artefak "padev-studio-apk" di halaman run (unduh dari HP lewat github.com, login). Bila repo PRIVATE, APK juga dipasang
# di rilis pra-terbit "apk-terbaru" (tautan unduh langsung, tetap butuh login). Repo publik: TIDAK diterbitkan sebagai rilis.
#
# Rahasia (Settings → Secrets and variables → Actions), semuanya opsional:
#   PADEV_DEBUG_KEYSTORE_B64   base64 debug.keystore TETAP (sandi android/androiddebugkey). Tanpa ini tiap run memakai kunci debug
#                              baru → SHA-256 berubah → harus dicatat ulang di apkSertifikatDebugSha256 & APK lama harus dihapus dulu.
#   PADEV_RILIS_KEYSTORE_B64 + PADEV_KEYSTORE_SANDI + PADEV_KUNCI_ALIAS + PADEV_KUNCI_SANDI → APK rilis (data nyata, cermin K-07).
# SHA-256 sertifikat tiap APK ditulis di ringkasan run (untuk konfigurasi pelaksana).
name: APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSI: 3.44.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # hanya untuk rilis pra-terbit "apk-terbaru" (repo privat)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSI }}

      - name: Pasang Flutter ${{ env.FLUTTER_VERSI }}
        if: steps.cache-flutter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSI}-stable.tar.xz"
          tar -xf /tmp/flutter.tar.xz -C "$HOME"

      - name: Siapkan Flutter
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics --no-cli-animations
          "$HOME/flutter/bin/flutter" --version

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: dep-${{ hashFiles('pubspec.lock', 'android/app/gradle.lockfile', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Periksa aset kantor 3D (sidik.json dari buat-kantor-apk.js)
        run: |
          node -e '
            const fs = require("fs"), c = require("crypto"), d = "assets/kantor/";
            const s = JSON.parse(fs.readFileSync(d + "sidik.json", "utf8")).berkas;
            let salah = 0;
            for (const [f, h] of Object.entries(s)) {
              const x = c.createHash("sha256").update(fs.readFileSync(d + f)).digest("hex");
              if (x !== h) { console.error("BEDA: " + f); salah++; }
            }
            if (salah) process.exit(1);
            console.log("aset kantor cocok: " + Object.keys(s).length + " berkas");'

      - name: Keystore debug tetap (opsional)
        env:
          KS: ${{ secrets.PADEV_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Keystore debug: dari rahasia PADEV_DEBUG_KEYSTORE_B64" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Keystore debug: BARU tiap run (isi rahasia PADEV_DEBUG_KEYSTORE_B64 agar SHA-256 tetap)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Analyze & uji Flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Unit test JVM (kripto, vektor kontrak)
        working-directory: android
        run: ./gradlew --console=plain -Ptarget-platform=android-arm64 :app:testDebugUnitTest

      - name: Build APK debug & profile (arm64)
        run: |
          flutter build apk --debug --target-platform android-arm64
          flutter build apk --profile --target-platform android-arm64

      - name: Build APK rilis (bila rahasia rilis ada)
        id: rilis
        env:
          KS: ${{ secrets.PADEV_RILIS_KEYSTORE_B64 }}
          SANDI: ${{ secrets.PADEV_KEYSTORE_SANDI }}
          ALIAS: ${{ secrets.PADEV_KUNCI_ALIAS }}
          SANDI_KUNCI: ${{ secrets.PADEV_KUNCI_SANDI }}
        run: |
          if [ -z "$KS" ] || [ -z "$SANDI" ] || [ -z "$ALIAS" ] || [ -z "$SANDI_KUNCI" ]; then
            echo "APK rilis: dilewati (rahasia rilis belum diisi)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/rilis.keystore"
          printf 'PADEV_KEYSTORE_SANDI=%s\nPADEV_KUNCI_ALIAS=%s\nPADEV_KUNCI_SANDI=%s\n' "$SANDI" "$ALIAS" "$SANDI_KUNCI" > "$RUNNER_TEMP/rilis.env"
          PADEV_RILIS_ENV="$RUNNER_TEMP/rilis.env" PADEV_RILIS_KEYSTORE="$RUNNER_TEMP/rilis.keystore" \
            flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/simbol-rilis
          rm -f "$RUNNER_TEMP/rilis.keystore" "$RUNNER_TEMP/rilis.env"
          echo "ada=1" >> "$GITHUB_OUTPUT"

      - name: Kumpulkan APK & SHA-256 sertifikat
        run: |
          versi=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          sha=$(git rev-parse --short HEAD)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p keluaran
          {
            echo "### APK PADEV Studio ${versi} (${sha})"
            echo "| APK | Ukuran | SHA-256 sertifikat |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for j in debug profile release; do
            f="build/app/outputs/flutter-apk/app-${j}.apk"
            [ -f "$f" ] || continue
            nama="padev-studio-${versi}-${j/release/rilis}-${sha}.apk"
            cp "$f" "keluaran/$nama"
            sertifikat=$("$apksigner" verify --print-certs "$f" | sed -n 's/.*SHA-256 digest: //p' | head -1)
            echo "| \`$nama\` | $(du -h "$f" | cut -f1) | \`$sertifikat\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "profile = demo (data contoh di tab Sesi), debug = uji. Data nyata = rilis."
            echo "Catat SHA-256 di konfigurasi pelaksana: apkSertifikatDebugSha256 (debug/profile) atau apkSertifikatSha256 (rilis)."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la keluaran

      - uses: actions/upload-artifact@v4
        with:
          name: padev-studio-apk
          path: keluaran/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Rilis pra-terbit "apk-terbaru" (hanya repo privat)
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          catatan="Dibangun otomatis dari ${GITHUB_REF_NAME} @ $(git rev-parse --short HEAD). Lihat ringkasan run untuk SHA-256 sertifikat."
          if gh release view apk-terbaru >/dev/null 2>&1; then
            gh release edit apk-terbaru --notes "$catatan" --prerelease
            for a in $(gh release view apk-terbaru --json assets -q '.assets[].name'); do gh release delete-asset apk-terbaru "$a" -y; done
          else
            gh release create apk-terbaru --prerelease --title "APK terbaru (otomatis)" --notes "$catatan" --target "$GITHUB_SHA"
          fi
          gh release upload apk-terbaru keluaran/*.apk --clobber
